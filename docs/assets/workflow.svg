<svg xmlns="http://www.w3.org/2000/svg" width="920" height="200" viewBox="0 0 920 200" role="img" aria-labelledby="title desc">
  <title id="title">One workflow for humans and AI agents</title>
  <desc id="desc">You define a task. Agents work and share context. Work logs and evidence go to human review. Accepted results are done; requested changes return to the agents.</desc>
  <defs>
    <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#438dff"/><stop offset="1" stop-color="#2854cb"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7186ae"/></marker>
  </defs>
  <rect width="920" height="200" rx="20" fill="#f3f6fc"/>
  <g stroke="#7186ae" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M174 79H198"/><path d="M356 79H380"/><path d="M538 79H562"/><path d="M720 79H744"/>
    <path d="M641 114V156H277V116"/>
  </g>
  <g stroke="#d8e2f2">
    <rect x="20" y="40" width="154" height="76" rx="13" fill="white"/>
    <rect x="202" y="40" width="154" height="76" rx="13" fill="url(#blue)" stroke="none"/>
    <rect x="384" y="40" width="154" height="76" rx="13" fill="white"/>
    <rect x="566" y="40" width="154" height="76" rx="13" fill="white"/>
    <rect x="748" y="40" width="152" height="76" rx="13" fill="#ff7a32" stroke="none"/>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="16" text-anchor="middle" fill="#14294c">
    <text x="97" y="72" font-weight="650">Define the task</text><text x="97" y="95" font-size="13" fill="#576b8b">Human intent</text>
    <text x="279" y="72" font-weight="650" fill="white">Agents work</text><text x="279" y="95" font-size="13" fill="#e4efff">Shared context</text>
    <text x="461" y="72" font-weight="650">Record evidence</text><text x="461" y="95" font-size="13" fill="#576b8b">Time · tokens · cost</text>
    <text x="643" y="72" font-weight="650">Human review</text><text x="643" y="95" font-size="13" fill="#576b8b">Accept or refine</text>
    <text x="824" y="72" font-weight="650">Done</text><text x="824" y="95" font-size="13">A shared result</text>
  </g>
  <rect x="385" y="143" width="152" height="26" rx="13" fill="#f3f6fc"/>
  <text x="461" y="161" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle" fill="#576b8b">Request changes</text>
</svg>
