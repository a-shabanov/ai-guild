# Dev database. Credentials here are local-only defaults; override via .env for anything shared.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aitracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aitracker}
      POSTGRES_DB: ${POSTGRES_DB:-aitracker}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
